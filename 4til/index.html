<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To'rt Til maktabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticky top bar with a four-language switch; each language repaints the page in its own accent. Left-aligned working columns, dense card grids. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --surface-2:#eceee7; --ink:#16202b; --muted:#5a6570; --line:#d7dbd2;
  --a-en:#1f4fd8; --a-ru:#c2283a; --a-ar:#0b7a64; --a-es:#b35900;
  --on-accent:#ffffff; --good:#17794a; --bad:#c0392b;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"Noto Naskh Arabic","Geeza Pro","Segoe UI",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f151c; --surface:#17202a; --surface-2:#1e2935; --ink:#e9edf0; --muted:#9ba7b3; --line:#2b3745;
    --a-en:#86a8ff; --a-ru:#ff8390; --a-ar:#52d3b5; --a-es:#ffb454;
    --on-accent:#0f151c; --good:#5fd39a; --bad:#ff8a7a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f151c; --surface:#17202a; --surface-2:#1e2935; --ink:#e9edf0; --muted:#9ba7b3; --line:#2b3745;
  --a-en:#86a8ff; --a-ru:#ff8390; --a-ar:#52d3b5; --a-es:#ffb454;
  --on-accent:#0f151c; --good:#5fd39a; --bad:#ff8a7a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;--accent:var(--a-en)}
body[data-lang="ru"]{--accent:var(--a-ru)}
body[data-lang="ar"]{--accent:var(--a-ar)}
body[data-lang="es"]{--accent:var(--a-es)}
body{--soft:color-mix(in srgb,var(--accent) 12%,var(--surface))}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.5rem,4vw,2.3rem)}
h2{font-size:1.25rem}
h3{font-size:.95rem;font-weight:500}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ar{font-family:var(--arabic);font-size:1.35em;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 0}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand i{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:22px;height:22px}
.brand i b{border-radius:3px}
.brand i b:nth-child(1){background:var(--a-en)}.brand i b:nth-child(2){background:var(--a-ru)}
.brand i b:nth-child(3){background:var(--a-ar)}.brand i b:nth-child(4){background:var(--a-es)}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.langs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding:28px 0 64px;display:flex;flex-direction:column;gap:28px}
.lead{color:var(--muted);max-width:65ch}
.head{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-weight:700;color:var(--accent);font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}
.hero .txt{display:flex;flex-direction:column;gap:14px;justify-content:center}
.hello{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hello button{border:0;border-radius:10px;padding:16px 14px;text-align:left;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.hello button strong{font-family:var(--display);font-size:1.35rem;line-height:1.3}
.hello button.ar-b strong{font-family:var(--arabic);font-size:1.9rem;line-height:1.2}
.hello button span{font-size:.85rem;color:var(--muted)}
.hello .h-en strong{color:var(--a-en)}.hello .h-ru strong{color:var(--a-ru)}.hello .h-ar strong{color:var(--a-ar)}.hello .h-es strong{color:var(--a-es)}
.hello button[aria-pressed="true"]{outline:2px solid var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px 18px;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:10px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.stat b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.day{background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);padding:20px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.day .w{font-family:var(--display);font-size:1.6rem;color:var(--accent)}
.day .w.ar{font-family:var(--arabic);font-size:2.2rem}
.steps{counter-reset:s;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.steps li::before{content:counter(s);font-family:var(--display);color:var(--accent);font-size:1.3rem;display:block}
.steps a{font-weight:600}

/* controls */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.9rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0}
input[type=search]{flex:1 1 200px;max-width:320px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:500}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

/* word cards */
.word{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.word.known{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.word .t{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
.word .t.ar{font-size:1.8rem;font-weight:700;line-height:1.5}
.word .tr{font-size:.85rem;color:var(--muted);font-style:italic}
.word .u{color:var(--muted)}
.hidden-tr .u,.hidden-tr .puz{filter:blur(6px);cursor:pointer;user-select:none}
.hidden-tr .show .u,.hidden-tr .show .puz{filter:none}
.word .f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.82rem;font-weight:600}
.mini.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.say{border:0;background:var(--soft);color:var(--accent);border-radius:8px;padding:4px 10px;font-size:.82rem;font-weight:700}
.empty{color:var(--muted);padding:24px 0}

/* phrases */
.phr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.phr.on{background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.phr .pt{font-size:1.1rem;font-weight:600;overflow-wrap:anywhere}
.phr .pt.ar{font-size:1.6rem;line-height:1.6}
.phr .ptr{font-size:.85rem;color:var(--muted);font-style:italic}
.phr .puz{color:var(--muted)}
.phr .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cat-h{margin-top:8px;color:var(--muted);font-family:var(--body);font-weight:700;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:640px;display:flex;flex-direction:column;gap:18px}
.quiz .meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.quiz .qw{font-family:var(--display);font-size:clamp(1.4rem,5vw,2rem);color:var(--accent);overflow-wrap:anywhere}
.quiz .qw.ar{font-family:var(--arabic);font-size:clamp(2rem,7vw,2.8rem)}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;font-weight:600;font-size:1.05rem;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.85rem;font-family:var(--body)}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt .ar{font-size:1.5rem}
.fb{font-weight:700}.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.res b{font-family:var(--display);font-size:2.4rem;color:var(--accent)}
.miss{margin:0;padding-left:18px;color:var(--muted)}
.miss strong{color:var(--ink)}

/* lessons */
details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.lesson summary{padding:16px 18px;cursor:pointer;font-family:var(--display);font-weight:500;display:flex;gap:12px;align-items:baseline}
details.lesson summary span{color:var(--accent);font-variant-numeric:tabular-nums}
details.lesson .in{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
details.lesson p{max-width:65ch}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td:first-child{font-weight:700;color:var(--accent)}
td.ar{white-space:nowrap}
.tip{background:var(--soft);border-left:4px solid var(--accent);padding:12px 14px;border-radius:0 10px 10px 0;max-width:65ch}

/* apps */
.app h3{font-size:1rem;font-weight:700}
.app .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.app p{color:var(--muted);font-size:.95rem}
.app .use{color:var(--ink);font-size:.9rem}
.app a{margin-top:auto;font-weight:700}

.okm{font-family:var(--body);font-size:.75rem;font-style:normal;font-weight:700;color:var(--good);margin-left:auto}
.stage{display:flex;flex-direction:column;gap:12px}
.stage-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-top:10px}
.tag.lvl{background:var(--accent);color:var(--on-accent)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{min-height:86px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);font-weight:700;padding:8px;overflow-wrap:anywhere;color:var(--muted);font-size:1rem}
.mc.open{background:var(--surface);border-color:var(--accent);color:var(--ink)}
.mc.done{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:var(--good);color:var(--ink)}
.mc.tgc.open,.mc.tgc.done{color:var(--accent)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{width:44px;height:50px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:1.2rem;display:grid;place-items:center;padding:0}
.tile:disabled{opacity:.25}
.tile.on{border-color:var(--accent);color:var(--accent)}
.tile.on:disabled{opacity:1}
.tile.empty{border-style:dashed;background:transparent}
.tile .ar{font-size:1.5rem;line-height:1}
.timer{display:flex;align-items:baseline;gap:12px;color:var(--muted);font-weight:600}
.timer b{font-family:var(--display);font-size:2.2rem;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.author{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:520px}
.author img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--accent)}
.aname{font-family:var(--display);font-weight:700;font-size:1.2rem}
.author{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.author img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--accent)}
.author div{display:flex;flex-direction:column;gap:2px}
.author strong{font-family:var(--display);font-size:1.15rem}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--muted);font-size:.9rem}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .langs{margin-left:0;width:100%}
  .langs button{flex:1}
  .phr{grid-template-columns:1fr}
  .phr .act{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

function newQuiz(){
  var all=Q.src==="w"?W:P,pool=all;
  if(Q.cat!=="all"){pool=all.filter(function(x){return x.cat===Q.cat;});}
  if(!pool.length){pool=all;Q.cat="all";}
  var ai=Q.dir==="t2u"?0:L().i;
  Q.qs=shuffle(pool).slice(0,10).map(function(it){
    var same=shuffle(all.filter(function(x){return x!==it&&x.cat===it.cat&&x.row[ai]!==it.row[ai];}));
    var rest=shuffle(all.filter(function(x){return x!==it&&x.cat!==it.cat&&x.row[ai]!==it.row[ai];}));
    var others=same.concat(rest).slice(0,2);
    return {it:it,opts:shuffle([it].concat(others))};
  });
  Q.n=0;Q.score=0;Q.picked=null;Q.wrong=[];
}

var G={game:"mem",pool:"w",m:null,s:null,t:{on:false,left:60,score:0,total:0,cur:null,ended:false},timer:null};
function gpool(){
  if(G.pool==="i")return IW.map(function(x){return {u:x[0],t:x[1],ar:false};});
  return W.map(function(w){return {u:w.row[0],t:tg(w.row),ar:S.lang==="ar"};});
}
function gAr(it){return it.ar?' class="ar" dir="rtl" lang="ar"':'';}
function memNew(){
  var six=shuffle(gpool()).slice(0,6),cards=[];
  six.forEach(function(it,p){cards.push({p:p,text:it.t,ar:it.ar,tg:true});cards.push({p:p,text:it.u,ar:false,tg:false});});
  G.m={cards:shuffle(cards),open:[],done:{},moves:0,lock:false};
}
function scrNew(keep){
  var pool=gpool().filter(function(it){var n=Array.from(it.t).length;return it.t.indexOf(" ")<0&&n>=3&&n<=11;});
  var it=pool[Math.floor(Math.random()*pool.length)],ch=Array.from(it.t),tiles=shuffle(ch),n=0;
  while(tiles.join("")===it.t&&n++<10)tiles=shuffle(ch);
  G.s={it:it,tiles:tiles,pick:[],state:null,streak:keep&&G.s?G.s.streak:0};
}
function spdNext(){
  var pool=gpool(),it=pool[Math.floor(Math.random()*pool.length)],ok=Math.random()<0.5,shown=it.u;
  if(!ok){var o=pool[Math.floor(Math.random()*pool.length)];if(o.u===it.u){ok=true;}else{shown=o.u;}}
  G.t.cur={it:it,shown:shown,ok:ok};
}
function spdStop(){if(G.timer){clearInterval(G.timer);G.timer=null;}}
function spdStart(){
  spdStop();G.t={on:true,left:60,score:0,total:0,cur:null,ended:false};spdNext();
  G.timer=setInterval(function(){
    G.t.left--;var el=$("tleft");if(el)el.textContent=G.t.left;
    if(G.t.left<=0){spdStop();G.t.on=false;G.t.ended=true;var b=S.best.spd||0;if(G.t.score>b){S.best.spd=G.t.score;save();}if(view()==="oyinlar")render(true);}
  },1000);
}
function vGames(){
  var out=head(G.pool==="i"?"Ingliz tili · IELTS":L().name,"O'yinlar","So'zlarni o'yin orqali mustahkamlang. Uch xil o'yin bor, so'zlar lug'at bo'limidan yoki IELTS akademik lug'atidan olinadi.")+
  '<div class="tools"><div class="chips">'+seg("game",G.game,[["mem","Juftini top"],["scr","Harflardan so'z ter"],["spd","60 soniya"]])+'</div><div class="chips">'+seg("gpool",G.pool,[["w",L().short+" lug'at"],["i","IELTS so'zlari (inglizcha)"]])+'</div></div>';
  if(G.game==="mem"){
    if(!G.m)memNew();
    var m=G.m,won=Object.keys(m.done).length===6;
    out+='<div class="quiz" style="max-width:680px"><div class="meta"><span>Har bir so\'zning tarjimasini toping</span><span>Urinishlar: '+m.moves+'</span></div><div class="mem">';
    m.cards.forEach(function(c,i){
      var dn=m.done[c.p],op=m.open.indexOf(i)>=0;
      out+='<button class="mc'+(dn?" done":op?" open":"")+(c.tg?" tgc":"")+'" data-act="mcard" data-v="'+i+'"'+(dn?" disabled":"")+' aria-label="'+(dn||op?"":"Yopiq karta")+'">'+(dn||op?'<span'+(c.ar?' class="ar" dir="rtl" lang="ar"':'')+'>'+c.text+'</span>':"?")+'</button>';
    });
    out+='</div>';
    if(won)out+='<div class="fb ok" role="status">Barakalla! '+m.moves+' ta urinishda topdingiz.'+(S.best.mem?' Eng yaxshi natijangiz: '+S.best.mem+'.':'')+'</div>';
    out+='<div class="btns"><button class="btn'+(won?"":" ghost")+'" data-act="mnew">Yangi o\'yin</button></div></div>';
  }else if(G.game==="scr"){
    if(!G.s)scrNew(false);
    var s=G.s,rtl=s.it.ar?' dir="rtl"':'';
    out+='<div class="quiz"><div class="meta"><span>Harflarni to\'g\'ri tartibda bosing</span><span>Ketma-ket to\'g\'ri: '+s.streak+'</span></div><div><p class="lead">O\'zbekchasi</p><div class="qw">'+s.it.u+'</div></div><div class="tiles slots"'+rtl+'>';
    for(var i=0;i<s.tiles.length;i++){
      out+=i<s.pick.length?'<button class="tile on" data-act="sun" data-v="'+i+'"'+(s.state==="ok"?" disabled":"")+' aria-label="Harfni olib tashlash"><span'+gAr(s.it)+'>'+s.tiles[s.pick[i]]+'</span></button>':'<span class="tile empty"></span>';
    }
    out+='</div><div class="tiles"'+rtl+'>';
    s.tiles.forEach(function(ch,i){out+='<button class="tile" data-act="stile" data-v="'+i+'"'+(s.pick.indexOf(i)>=0||s.state==="ok"?" disabled":"")+'><span'+gAr(s.it)+'>'+ch+'</span></button>';});
    out+='</div>';
    if(s.state==="ok")out+='<div class="fb ok" role="status">To\'g\'ri: <span'+gAr(s.it)+'>'+s.it.t+'</span></div>';
    else if(s.state==="no")out+='<div class="fb no" role="status">Hali to\'g\'ri emas. Harflarni olib tashlab, qayta terib ko\'ring.</div>';
    else if(s.state==="show")out+='<div class="fb" role="status">Javob: <span'+gAr(s.it)+'>'+s.it.t+'</span></div>';
    out+='<div class="btns">'+(s.state==="ok"||s.state==="show"?'<button class="btn" data-act="snext" id="nextb">Keyingi so\'z</button>':'<button class="btn ghost" data-act="sclear">Tozalash</button><button class="btn ghost" data-act="sshow">Javobni ko\'rsatish</button>')+'</div></div>';
  }else{
    var t=G.t;
    out+='<div class="quiz"><div class="meta"><span>Tarjima to\'g\'rimi yoki noto\'g\'ri?</span><span>Eng yaxshi natija: '+(S.best.spd||0)+'</span></div>';
    if(t.on){
      out+='<div class="timer"><b id="tleft">'+t.left+'</b><span>soniya qoldi · ball: '+t.score+'</span></div><div><div class="qw"><span'+gAr(t.cur.it)+'>'+t.cur.it.t+'</span></div><p class="lead">bu «'+t.cur.shown+'» deganimi?</p></div>'+
      '<div class="btns"><button class="btn" data-act="tans" data-v="1">To\'g\'ri</button><button class="btn ghost" data-act="tans" data-v="0">Noto\'g\'ri</button></div>';
    }else{
      out+=(t.ended?'<div class="res"><b>'+t.score+'</b><p>'+t.total+' ta savoldan '+t.score+' tasiga to\'g\'ri javob berdingiz.</p></div>':'<p>60 soniya ichida iloji boricha ko\'p so\'zni tekshiring. Ekranda so\'z va uning tarjimasi chiqadi, siz tarjima to\'g\'ri yoki noto\'g\'riligini belgilaysiz. Har bir to\'g\'ri javob 1 ball.</p>')+
      '<div class="btns"><button class="btn" data-act="tstart">'+(t.ended?"Yana o'ynash":"Boshlash")+'</button></div>';
    }
    out+='</div>';
  }
  return out;
}
function gameClick(a,v){
  if(a==="game"){G.game=v;spdStop();G.t.on=false;render(true);return true;}
  if(a==="gpool"){G.pool=v;G.m=null;G.s=null;spdStop();G.t={on:false,left:60,score:0,total:0,cur:null,ended:false};render(true);return true;}
  if(a==="mnew"){memNew();render(true);return true;}
  if(a==="mcard"){
    var m=G.m,i=+v;if(m.lock||m.open.indexOf(i)>=0||m.done[m.cards[i].p])return true;
    m.open.push(i);
    if(m.open.length===2){
      m.moves++;var x=m.cards[m.open[0]],y=m.cards[m.open[1]];
      if(x.p===y.p){m.done[x.p]=1;m.open=[];if(Object.keys(m.done).length===6&&(!S.best.mem||m.moves<S.best.mem)){S.best.mem=m.moves;save();}}
      else{m.lock=true;setTimeout(function(){m.open=[];m.lock=false;if(view()==="oyinlar"&&G.game==="mem"&&G.m===m)render(true);},900);}
    }
    render(true);return true;
  }
  if(a==="stile"){var s=G.s;s.pick.push(+v);s.state=null;if(s.pick.length===s.tiles.length){var word=s.pick.map(function(k){return s.tiles[k];}).join("");if(word===s.it.t){s.state="ok";s.streak++;}else{s.state="no";s.streak=0;}}render(true);var nb=$("nextb");if(nb)nb.focus();return true;}
  if(a==="sun"){G.s.pick.splice(+v,1);G.s.state=null;render(true);return true;}
  if(a==="sclear"){G.s.pick=[];G.s.state=null;render(true);return true;}
  if(a==="sshow"){G.s.state="show";G.s.streak=0;render(true);return true;}
  if(a==="snext"){scrNew(true);render(true);return true;}
  if(a==="tstart"){spdStart();render(true);return true;}
  if(a==="tans"){var t=G.t;if(!t.on)return true;t.total++;if((v==="1")===t.cur.ok)t.score++;spdNext();render(true);return true;}
  if(a==="mlv"){UI.mlv=v;render(true);return true;}
  return false;
}

/* ---------- RENDER ---------- */
function render(keepScroll){
  var v=view();
  document.body.setAttribute("data-lang",(v==="ielts"||v==="kinolar"||(v==="oyinlar"&&G.pool==="i"))?"en":S.lang);if(v!=="oyinlar"){spdStop();G.t.on=false;}
  $("langs").innerHTML=["en","ru","ar","es"].map(function(c){return '<button data-act="lang" data-v="'+c+'" aria-pressed="'+(S.lang===c)+'">'+LANGS[c].short+'</button>';}).join("");
  $("nav").innerHTML=VIEWS.map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===v?' aria-current="page"':'')+'>'+x[1]+'</a>';}).join("");
  var html=v==="darslar"?vLessons():v==="lugat"?vVocab():v==="test"?vQuiz():v==="iboralar"?vPhrases():v==="ilovalar"?vApps():v==="ielts"?vIelts():v==="kinolar"?vMovies():v==="oyinlar"?vGames():vHome();
  $("view").innerHTML=html;
  if(v==="lugat")fillGrid();
  if(!keepScroll)window.scrollTo(0,0);
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act"),v=el.getAttribute("data-v"),k=el.getAttribute("data-k");
  if(gameClick(a,v))return;
  if(a==="lang"){S.lang=v;save();Q.qs=null;G.m=null;G.s=null;render(true);}
  else if(a==="say"){e.stopPropagation();speak(k);}
  else if(a==="cat"){UI.cat=v==="all"?"all":WCATS[+v];render(true);}
  else if(a==="pcat"){UI.pcat=v==="all"?"all":PCATS[+v];render(true);}
  else if(a==="known"||a==="mem"){setDone(k,!isDone(k));if(a==="known"){fillGrid();}else{render(true);}}
  else if(a==="reveal"){el.classList.toggle("show");}
  else if(a==="qsrc"){Q.src=v;Q.cat="all";Q.qs=null;render(true);}
  else if(a==="qdir"){Q.dir=v;Q.qs=null;render(true);}
  else if(a==="restart"){Q.qs=null;render(true);}
  else if(a==="opt"){
    if(Q.picked!==null)return;
    Q.picked=+v;var q=Q.qs[Q.n];
    if(q.opts[Q.picked]===q.it){Q.score++;setDone(q.it.k,true);}else{Q.wrong.push(q.it);}
    render(true);var nb=$("nextb");if(nb)nb.focus();
  }
  else if(a==="next"){
    Q.n++;Q.picked=null;
    if(Q.n>=Q.qs.length&&Q.qs.length===10){var b=S.best[S.lang];if(b==null||Q.score>b){S.best[S.lang]=Q.score;save();}}
    render(true);
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="hide"){UI.hide=t.checked;$("grid").classList.toggle("hidden-tr",UI.hide);}
  else if(t.id==="phide"){UI.phide=t.checked;render(true);}
  else if(t.id==="qcat"){var c=Q.src==="w"?WCATS:PCATS;Q.cat=t.value==="all"?"all":c[+t.value];Q.qs=null;render(true);}
  else if(t.getAttribute("data-act")==="lesson"){setDone(t.getAttribute("data-k"),t.checked,t.getAttribute("data-l"));}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){UI.q=e.target.value;fillGrid();}});
window.addEventListener("hashchange",function(){render(false);});
render(true);
</script>
