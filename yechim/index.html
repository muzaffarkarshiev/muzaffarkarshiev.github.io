<style>
  :root{
    --bg:#f4f5fb; --card:#ffffffd9; --ink:#171a26; --muted:#5b6274; --line:#e2e5f0;
    --a1:#5b5bf7; --a2:#a14bf5; --a3:#13b5a6; --soft:#ecebff;
    --ok:#139a5f; --ok-soft:#e3f7ec; --warn:#b06400; --warn-soft:#fff3df;
    --grad:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0e1018;--card:#181b27d9;--ink:#eceef6;--muted:#9ba2b6;--line:#2a2f42;--soft:#24234a;--ok:#4bd194;--ok-soft:#14301f;--warn:#f2b453;--warn-soft:#3a2b12;}
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden}
  /* fon: grid qog'oz + rangli dog'lar */
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:28px 28px;opacity:.45}
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-1;animation:float 18s ease-in-out infinite}
  .b1{width:380px;height:380px;background:var(--a1);top:-120px;left:-100px}
  .b2{width:320px;height:320px;background:var(--a2);top:40%;right:-120px;animation-delay:-6s}
  .b3{width:300px;height:300px;background:var(--a3);bottom:-120px;left:20%;animation-delay:-12s}
  @keyframes float{50%{transform:translate(40px,30px) scale(1.1)}}

  .wrap{max-width:820px;margin:0 auto;padding:14px 16px 60px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .brand{font-weight:800;display:flex;align-items:center;gap:8px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800}
  .langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
  .langs button{border:0;background:transparent;color:var(--muted);font:600 .82rem Inter;padding:6px 11px;border-radius:999px;cursor:pointer}
  .langs button.on{background:var(--grad);color:#fff}

  /* HERO */
  .hero{position:relative;margin-top:16px;border-radius:24px;padding:30px 22px 26px;color:#fff;background:var(--grad);overflow:hidden;box-shadow:0 18px 50px -20px #5b5bf7aa}
  .hero h1{font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.15;margin:0 0 8px;position:relative;z-index:1}
  .hero p{margin:0;opacity:.92;max-width:520px;position:relative;z-index:1}
  .hero .hand{font-family:Caveat,cursive;font-size:1.5rem;opacity:.95}
  .sym{position:absolute;font-weight:700;opacity:.18;animation:drift 12s ease-in-out infinite;user-select:none}
  @keyframes drift{50%{transform:translateY(-14px) rotate(8deg)}}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
  .stat{background:#ffffff26;border:1px solid #ffffff40;border-radius:12px;padding:6px 12px;font-size:.85rem;backdrop-filter:blur(6px)}
  .stat b{font-size:1.05rem;margin-right:4px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px;backdrop-filter:blur(10px)}
  h2{font-size:1.2rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  h2 .ic{width:30px;height:30px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:1rem}

  .drop{position:relative;border:2px dashed var(--line);border-radius:16px;padding:28px 14px;text-align:center;cursor:pointer;transition:.2s}
  .drop:hover,.drop.over{border-color:var(--a1);background:var(--soft);transform:translateY(-2px)}
  .drop svg{margin-bottom:6px}
  .drop b{display:block;font-size:1.06rem;margin-bottom:2px}
  .drop span{color:var(--muted);font-size:.9rem}
  #preview{max-width:100%;max-height:320px;border-radius:12px;margin:12px auto 0;display:none;box-shadow:0 8px 24px -10px #0006}
  textarea,input[type=search]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;background:transparent;color:var(--ink)}
  textarea{min-height:72px;resize:vertical}
  label.small{display:block;font-size:.88rem;color:var(--muted);margin:14px 0 6px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button.btn{font:inherit;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700;transition:.15s}
  .primary{background:var(--grad);color:#fff;flex:1;box-shadow:0 10px 24px -12px #5b5bf7}
  .primary:hover:not(:disabled){transform:translateY(-1px)}
  .primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .ghost{background:transparent;border:1px solid var(--line)!important;color:var(--ink)}
  .status{margin-top:12px;color:var(--muted);font-size:.93rem;min-height:1.2em}
  .err{color:#e04848}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;font:500 .88rem Inter;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--a1);background:var(--soft)}

  /* natija */
  .tag{display:inline-block;background:var(--soft);color:var(--a1);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:700;margin-right:6px}
  .lvl{background:var(--warn-soft);color:var(--warn)}
  .problem{background:var(--soft);border-left:4px solid var(--a1);border-radius:10px;padding:12px 14px;margin:12px 0}
  .timeline{position:relative;margin-top:6px}
  .step{position:relative;display:flex;gap:14px;padding:12px 0}
  .step::before{content:"";position:absolute;left:16px;top:44px;bottom:-12px;width:2px;background:linear-gradient(var(--a1),var(--a3));opacity:.35}
  .step:last-child::before{display:none}
  .num{flex:0 0 34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 6px 14px -6px #5b5bf7;z-index:1}
  .step h3{margin:4px 0 2px;font-size:1rem}
  .step p{margin:2px 0}
  .math{overflow-x:auto;padding:8px 12px;margin-top:6px;background:var(--bg);border-radius:10px}
  .answer{background:var(--ok-soft);border-radius:14px;padding:14px 16px;margin-top:14px;font-size:1.05rem}
  .answer b{color:var(--ok)}
  .tip{background:var(--warn-soft);border-radius:14px;padding:12px 14px;margin-top:12px}
  .tip b{color:var(--warn)}
  .sep{margin-top:28px;padding-top:18px;border-top:2px dashed var(--line)}

  /* qanday ishlaydi */
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .how div{text-align:center;padding:14px 8px;border-radius:16px;background:var(--bg)}
  .how .n{width:52px;height:52px;margin:0 auto 8px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-size:1.5rem}
  .how b{display:block;font-size:.95rem}
  .how span{font-size:.82rem;color:var(--muted)}
  @media(max-width:520px){.how{grid-template-columns:1fr}}

  ul.tips{margin:0;padding-left:0;list-style:none}
  ul.tips li{padding:6px 0 6px 30px;position:relative}
  ul.tips li::before{content:"✓";position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:6px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:.75rem;font-weight:800}

  /* formulalar */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
  .ftile{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;background:var(--card)}
  .ftile:hover{border-color:var(--a1);transform:translateY(-2px)}
  .ftile .h{display:flex;align-items:center;gap:8px;font-weight:700}
  .ftile .e{font-size:1.3rem;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft)}
  .ftile .cat{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .ftile .body{display:none;margin-top:8px;font-size:.92rem}
  .ftile.open{grid-column:1/-1;border-color:var(--a1)}
  .ftile.open .body{display:block}
  .ftile .body div{padding:5px 0;overflow-x:auto}
  .ftile .note{color:var(--muted);font-size:.85rem;margin-top:4px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  .fact{display:flex;gap:12px;align-items:flex-start}
  .fact .big{font-size:2rem}
  .fact p{margin:0}

  /* muallif */
  .author{display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
  .author::after{content:"∑";position:absolute;right:-10px;bottom:-40px;font-size:9rem;font-weight:800;opacity:.06}
  .ava{flex:0 0 96px;height:96px;border-radius:50%;padding:3px;background:var(--grad)}
  .ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--card);display:block}
  .author h3{margin:0;font-size:1.2rem}
  .author .role{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
  .ig{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;
      background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)}
  footer{color:var(--muted);font-size:.82rem;margin-top:22px;text-align:center}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--a1);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .fade{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}}
</style>
</head>

<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">π</div><span data-i="brand"></span></div>

      <button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button>
    </div></div>
  </div>

  <section class="hero">
    <span class="sym" style="top:8%;right:6%;font-size:3.4rem">∫</span>
    <span class="sym" style="top:52%;right:22%;font-size:2.4rem;animation-delay:-3s">√x</span>
    <span class="sym" style="bottom:6%;right:4%;font-size:2.8rem;animation-delay:-5s">π</span>

    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card hidden" id="result"></section>

  <section class="card">
    <h2><span class="ic">⚙️</span><span data-i="howTitle"></span></h2>
    <div class="how">
      <div><div class="n">📸</div><b data-i="h1"></b><span data-i="h1d"></span></div>
      <div><div class="n">🧠</div><b data-i="h2"></b><span data-i="h2d"></span></div>
      <div><div class="n">✅</div><b data-i="h3"></b><span data-i="h3d"></span></div>
    </div>
  </section>

  <section class="card">
    <h2><span class="ic">📷</span><span data-i="photoTitle"></span></h2>
    <ul class="tips" id="photoTips"></ul>
  </section>

  <section class="card">
    <h2><span class="ic">📚</span><span data-i="fTitle"></span></h2>
    <input type="search" id="fsearch">
    <div class="filters" id="filters"></div>
    <div class="fgrid" id="fgrid"></div>
  </section>

  <section class="card">
    <h2><span class="ic">🧭</span><span data-i="planTitle"></span></h2>
    <ul class="tips" id="plan"></ul>
  </section>

  <section class="card">
    <div class="fact">
      <div class="big">💡</div>
      <div><b data-i="factTitle"></b><p id="fact"></p>
      <button class="chip" id="nextFact" style="margin-top:8px" data-i="nextFact"></button></div>
    </div>
  </section>

function typeset(el){
  if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetClear && MathJax.typesetClear([el]); MathJax.typesetPromise([el]).catch(()=>{}); }
  else setTimeout(()=>typeset(el), 400);
}

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent = t(el.dataset.i); });
  $("note").placeholder = t("notePh");
  $("fsearch").placeholder = t("fSearch");

  $("examples").innerHTML = EXAMPLES[lang].map(x=>`<button class="chip">${esc(x)}</button>`).join("");
  $("examples").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ $("note").value=b.textContent; updateBtn(); });

function updateBtn(){ $("solve").disabled = !(imageBlob || $("note").value.trim()); }
$("note").addEventListener("input", updateBtn);
$("drop").addEventListener("click",()=>$("file").click());
$("file").addEventListener("change",e=>{ if(e.target.files[0]) loadImage(e.target.files[0]); });
["dragover","dragenter"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.add("over")}));

document.addEventListener("paste",e=>{ const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/")); if(it) loadImage(it.getAsFile()); });

function loadImage(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = ()=>{
    const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{ imageBlob=b; $("preview").src=URL.createObjectURL(b); $("preview").style.display="block"; updateBtn(); URL.revokeObjectURL(url); },"image/jpeg",0.9);
  };
  img.src = url;
}
$("clear").onclick = ()=>{
  imageBlob=null; lastSolution=null; $("file").value=""; $("note").value="";
  $("preview").style.display="none"; $("result").classList.add("hidden"); $("result").innerHTML=""; $("status").textContent=""; updateBtn();
};

const PROXY_URL = "";
const MODEL = "claude-sonnet-5-5";
function getKey(){ try{ return localStorage.getItem("anthropicKey")||""; }catch(_){ return ""; } }
function blobToB64(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(b); }); }
function systemPrompt(){
  return `You are a kind, patient math teacher. A student sent a math problem (as a photo and/or text).
Write EVERYTHING in ${t("langName")}.
Goals: solve it correctly and explain each step so a school student can understand.
Rules:
- If the image contains several problems and the student didn't pick one, solve each one as a separate item in "masalalar".
- In every step say WHAT we do and WHY, in simple words.
- Write math in LaTeX wrapped in $...$ (e.g. $x^2-5x+6=0$). Put each "ifoda" field inside $$...$$.
- Double-check all arithmetic. At the end verify the answer (e.g. substitute it back).
- If the image is unreadable or contains no math problem, put the reason in "xato".
Return ONLY this JSON, nothing else (keep these keys exactly):
{"masalalar":[{"shart":"problem statement","mavzu":"topic, e.g. Quadratic equation","daraja":"easy | medium | hard (in the output language)","usul":"which method and why, 1–2 sentences","qadamlar":[{"sarlavha":"short title","izoh":"plain explanation","ifoda":"$$...$$ or empty"}],"javob":"final answer","tekshirish":"how we check","maslahat":"the rule to remember for similar problems"}],"xato":""}`;
}
function extractJSON(s){
  s = s.trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a=s.indexOf("{"), b=s.lastIndexOf("}"); if(a<0||b<0) throw new Error("no json");
  return JSON.parse(s.slice(a,b+1));
}
async function ask(prompt, images, busyKey){
  $("status").innerHTML = `<span class="spinner"></span>${t(busyKey)}`;
  const content = [];
  for(const b of (images||[])) content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobToB64(b)}});
  content.push({type:"text",text:prompt});
  const body = {model:MODEL,max_tokens:8000,messages:[{role:"user",content}]};
  let url = PROXY_URL, headers = {"content-type":"application/json"};
  if(!PROXY_URL){
    const key = getKey();
    if(!key){ openKey(); throw {message:t("needKey")}; }
    url = "https://api.anthropic.com/v1/messages";
    Object.assign(headers,{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"});
  }
  let r;
  try{ r = await fetch(url,{method:"POST",headers,body:JSON.stringify(body)}); }catch(_){ throw {message:t("noAi")}; }
  if(r.status===429) throw {code:"rate_limited"};
  if(r.status===401||r.status===403){ if(!PROXY_URL) openKey(); throw {message:t("badKey")}; }
  if(!r.ok) throw {message:"API: "+r.status};
  const j = await r.json();
  return (j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
}
function openKey(){ $("keyBox").classList.remove("hidden"); $("keyInput").value=getKey(); $("keyBox").scrollIntoView({behavior:"smooth",block:"center"}); }
function showError(e){
  const m = e?.code==="not_granted"?t("denied"):e?.code==="rate_limited"?t("limited"):(e?.message||t("parse"));
  $("status").innerHTML = `<span class="err">⚠️ ${esc(m)}</span>`;
}
async function run(prompt, images, busyKey){
  $("solve").disabled = true;
  try{
    const text = await ask(prompt, images, busyKey);
    let data; try{ data = extractJSON(text); }catch(_){ throw {message:t("parse")}; }
    lastSolution = data; $("status").textContent = ""; renderResult(data, true);
  }catch(e){ showError(e); }
  finally{ updateBtn(); }
}
$("solve").onclick = ()=>{
  const note = $("note").value.trim();
  const p = systemPrompt() + (imageBlob ? "\n\nThe problem is in the attached image." : "") + (note ? `\nStudent's text/note: ${note}` : "");
  run(p, imageBlob ? [imageBlob] : null, imageBlob ? "reading" : "thinking");
};

function renderResult(data, scroll){
  const r = $("result"); r.classList.remove("hidden");
  if(data.xato && !(data.masalalar||[]).length){
    r.innerHTML = `<h2><span class="ic">😕</span>${t("fail")}</h2><p>${esc(data.xato)}</p><p class="status">${t("failHint")}</p>`; return;
  }
  const many = (data.masalalar||[]).length > 1;
  r.innerHTML = (data.masalalar||[]).map((m,i)=>`<div class="${i?'sep':''} fade">
    <h2><span class="ic">🧩</span>${many?t("nProblem")(i+1):t("problem")}</h2>
    ${m.mavzu?`<span class="tag">${esc(m.mavzu)}</span>`:""}${m.daraja?`<span class="tag lvl">${t("level")}: ${esc(m.daraja)}</span>`:""}
    <div class="problem">${esc(m.shart)}</div>
    ${m.usul?`<p><b>🛠️ ${t("method")}:</b> ${esc(m.usul)}</p>`:""}
    <div class="timeline">${(m.qadamlar||[]).map((q,k)=>`<div class="step"><div class="num">${k+1}</div><div style="min-width:0;flex:1">
        <h3>${esc(q.sarlavha)}</h3><p>${esc(q.izoh)}</p>${q.ifoda?`<div class="math">${esc(q.ifoda)}</div>`:""}</div></div>`).join("")}</div>
    <div class="answer"><b>✅ ${t("answer")}:</b> ${esc(m.javob)}</div>
    ${m.tekshirish?`<p><b>🔎 ${t("check")}:</b> ${esc(m.tekshirish)}</p>`:""}
    ${m.maslahat?`<div class="tip"><b>💡 ${t("remember")}:</b> ${esc(m.maslahat)}</div>`:""}
  </div>`).join("") + `<div class="row"><button class="btn ghost" id="simpler">${t("simpler")}</button><button class="btn ghost" id="similar">${t("similar")}</button></div>`;
  typeset(r);
  $("simpler").onclick = ()=> run(systemPrompt()+`\n\nBelow is a problem and its solution. The student did not understand it. Re-explain the SAME problem so a 10–12 year old understands: smaller steps, everyday analogies, keep the answer correct. Same JSON format.\n\nPrevious solution:\n`+JSON.stringify(lastSolution), null, "simplerWork");
  $("similar").onclick = ()=> run(systemPrompt()+`\n\nCreate ONE new practice problem of the same type and difficulty as the problem below (different numbers), and solve it fully in the same JSON format, so the student can practise.\n\nOriginal:\n`+JSON.stringify(lastSolution), null, "thinking");
  if(scroll) r.scrollIntoView({behavior:"smooth",block:"start"});
}
